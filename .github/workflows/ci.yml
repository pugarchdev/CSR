name: MahaCSR CI/CD Automated Test & Quality Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-quality-and-tests:
    name: Backend Typecheck & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Root & Backend Dependencies
        run: |
          npm ci --prefix backend

      - name: Generate Prisma Client
        run: |
          npm run prisma:generate --prefix backend
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mahacsr_test?schema=public"

      - name: Execute Backend TypeScript Compilation Check
        run: |
          npm run typecheck --prefix backend

      - name: Execute Backend Jest Test Suite
        run: |
          npm test --prefix backend
        env:
          NODE_ENV: test
          JWT_SECRET: "ci_pipeline_test_jwt_secret_key_32bytes_long"
          JWT_REFRESH_SECRET: "ci_pipeline_test_jwt_refresh_secret_key_32bytes_long"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mahacsr_test?schema=public"

  frontend-quality:
    name: Frontend Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: |
          npm ci --prefix frontend

      - name: Execute Frontend TypeScript Compilation Check
        run: |
          npm run typecheck --prefix frontend
